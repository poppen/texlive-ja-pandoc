name: update-pandoc

on:
  schedule:
    # 毎日 05:23 UTC（JST 14:23）
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve latest pandoc release and current version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(gh api repos/jgm/pandoc/releases/latest --jq .tag_name)
          current=$(grep -oP '^ARG PANDOC_VERSION=\K[\d.]+' Dockerfile)
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "Latest: ${latest} / Current: ${current}"

      - name: Update Dockerfile if outdated
        id: bump
        if: steps.ver.outputs.latest != steps.ver.outputs.current
        env:
          LATEST: ${{ steps.ver.outputs.latest }}
        run: |
          set -euo pipefail
          sed -i -E "s/^ARG PANDOC_VERSION=.*/ARG PANDOC_VERSION=${LATEST}/" Dockerfile
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/pandoc-${{ steps.ver.outputs.latest }}
          delete-branch: true
          commit-message: "chore: bump pandoc to ${{ steps.ver.outputs.latest }}"
          title: "chore: bump pandoc to ${{ steps.ver.outputs.latest }}"
          body: |
            Bumps pandoc `${{ steps.ver.outputs.current }}` → `${{ steps.ver.outputs.latest }}`.

            Release notes: https://github.com/jgm/pandoc/releases/tag/${{ steps.ver.outputs.latest }}

            Auto-generated by `.github/workflows/update-pandoc.yml`.
          labels: |
            dependencies
            automated
